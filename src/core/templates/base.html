<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Página web - Lab2{% endblock %}</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            margin: 0;
            padding: 0;
            color: #333;
        }

        header {
            background-color: #2c3e50;
            color: white;
            text-align: center;
            padding: 12px;
        }

        header h1 {
            margin: 5px 0;
            font-size: 28px;
        }

        main {
            max-width: 900px;
            margin: 25px auto;
            padding: 0 20px;
        }

        h2 {
            color: #2c3e50;
            margin-bottom: 20px;
        }

        .item {
            background-color: white;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid #d9d9d9;
            border-radius: 10px;
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.10);
        }

        .item h3 {
            margin-top: 0;
            margin-bottom: 12px;
            color: #34495e;
            font-size: 20px;
        }

        .item p {
            color: #555;
            line-height: 1.6;
            text-align: justify;
        }

        .date {
            font-size: 13px;
            color: #888;
            margin-top: 15px;
        }

        .search {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            margin: 10px 0 25px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
        }

        .search:focus {
            outline: none;
            border-color: #2c3e50;
        }
    </style>
</head>
<body>
    <header>
        <h1>Laboratorio 2</h1>
    </header>

    <main>
        {% block content %}
        {% endblock %}
    </main>
</body>
</html>
